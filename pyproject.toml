[project]
name = "pkmjson"
version = "0.3.0"
description = "An open dataset of Pokémon TCG sets, cards, printings and sealed products"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.21"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long lines here are mostly messages and docstrings that read better whole.
ignore = ["E501"]
